<h1>LabManager</h1>

<h2>Add Person</h2>

<form (ngSubmit)="addPerson()">

  <label>
    Name:
    <input
      type="text"
      name="name"
      [(ngModel)]="newPerson.name">
  </label>

  <br>

  <label>
    Email:
    <input
      type="email"
      name="email"
      [(ngModel)]="newPerson.email">
  </label>

  <br>

  <button type="submit">Add Person</button>

</form>

<h2>Persons</h2>

<p>Number of persons: {{ persons.length }}</p>

<ul>
  @for (person of persons; track person.id) {
    <li>
      {{ person.name }} - {{ person.email }}
    </li>
  }
</ul>
